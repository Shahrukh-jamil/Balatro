name: Deploy Balatro Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-Flatten and Patch game.love Root
        run: |
          # 1. Unpack game.love with overwrite flag
          mkdir -p /tmp/game_raw
          unzip -q -o game.love -d /tmp/game_raw

          # 2. Locate main.lua
          MAIN_PATH=$(find /tmp/game_raw -name "main.lua" | head -n 1)
          if [ -z "$MAIN_PATH" ]; then
            echo "ERROR: main.lua not found!"
            exit 1
          fi
          MAIN_DIR=$(dirname "$MAIN_PATH")
          echo "==> Found main.lua inside: $MAIN_DIR"

          # 3. Disable joystick in conf.lua (prevents mobile browser SDL crash)
          if [ -f "$MAIN_DIR/conf.lua" ]; then
            sed -i 's/function love.conf(t)/function love.conf(t)\n\tt.modules.joystick = false/' "$MAIN_DIR/conf.lua"
          fi

          # 4. Neutralize 'require "bit"' with a safe stub for WebAssembly
          python3 -c "
          p = '$MAIN_PATH'
          with open(p, 'r', encoding='utf-8', errors='ignore') as f:
              c = f.read()
          # Replace require 'bit' with a safe fallback table
          stub = 'bit = {bxor=function(a,b) return 0 end, band=function(a,b) return 0 end, bor=function(a,b) return 0 end, lshift=function(a,b) return a*(2^b) end, rshift=function(a,b) return math.floor(a/(2^b)) end}; package.loaded[\"bit\"] = bit;'
          c = c.replace('require \"bit\"', stub).replace(\"require 'bit'\", stub)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          print('==> Successfully replaced require bit with web stub')
          "

          # 5. Repack game.love cleanly with main.lua at the root
          rm -f game.love
          (cd "$MAIN_DIR" && zip -r -q "$GITHUB_WORKSPACE/game.love" .)

      - name: Compile with love.js
        run: |
          npm install -g love.js
          love.js -t "Balatro" -m 134217728 -c game.love dist

          # Mobile viewport scaling
          sed -i 's/<head>/<head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">/' dist/index.html

          # Mobile DevTools console + cache buster to clear stale game.data
          sed -i 's/<head>/<head><script src="https:\/\/cdn.jsdelivr.net\/npm\/eruda"><\/script><script>eruda.init();if(window.indexedDB){indexedDB.deleteDatabase("\/home\/web_user\/love");}<\/script>/' dist/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
