name: Deploy Balatro Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto-Flatten and Patch game.love Root
        run: |
          # 1. Unpack game.love
          mkdir -p /tmp/game_raw
          unzip -q -o game.love -d /tmp/game_raw

          # 2. Locate main.lua
          MAIN_PATH=$(find /tmp/game_raw -name "main.lua" | head -n 1)
          if [ -z "$MAIN_PATH" ]; then
            echo "ERROR: main.lua not found!"
            exit 1
          fi
          MAIN_DIR=$(dirname "$MAIN_PATH")
          echo "==> Found main.lua inside: $MAIN_DIR"

          # 3. Disable joystick in conf.lua
          if [ -f "$MAIN_DIR/conf.lua" ]; then
            sed -i 's/function love.conf(t)/function love.conf(t)\n\tt.modules.joystick = false/' "$MAIN_DIR/conf.lua"
          fi

          # 4. Patch require 'bit', skip splash, and fix WebGL shaders
          python3 -c "
          import os, re

          main_dir = '$MAIN_DIR'

          # Fix 'bit' module
          main_file = os.path.join(main_dir, 'main.lua')
          if os.path.exists(main_file):
              with open(main_file, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              stub = 'bit = {bxor=function(a,b) return 0 end, band=function(a,b) return 0 end, bor=function(a,b) return 0 end, lshift=function(a,b) return a*(2^b) end, rshift=function(a,b) return math.floor(a/(2^b)) end}; package.loaded[\"bit\"] = bit;'
              c = c.replace('require \"bit\"', stub).replace(\"require 'bit'\", stub)
              with open(main_file, 'w', encoding='utf-8') as f:
                  f.write(c)

          # Skip the 15-second vortex splash to boot straight to the game menu
          globals_file = os.path.join(main_dir, 'globals.lua')
          if os.path.exists(globals_file):
              with open(globals_file, 'r', encoding='utf-8', errors='ignore') as f:
                  g = f.read()
              g = g.replace(\"skip_splash = 'No'\", \"skip_splash = 'Yes'\")
              if 'skip_splash' not in g:
                  g = g.replace('self.SETTINGS = {', 'self.SETTINGS = {\\n        skip_splash = \"Yes\",')
              with open(globals_file, 'w', encoding='utf-8') as f:
                  f.write(g)

          # Fix hologram.fs loop
          holo_file = os.path.join(main_dir, 'resources/shaders/hologram.fs')
          if os.path.exists(holo_file):
              with open(holo_file, 'r', encoding='utf-8', errors='ignore') as f:
                  h = f.read()
              pat_holo = r'for\s*\(\s*int\s+i\s*=\s*-glow_samples;.*?glow\s*\+\s*_a;\s*\}\s*\}\s*\}'
              rep_holo = '''for (int i = 0; i <= 8; ++i) {
                      for (int j = 0; j <= 8; ++j) {
                          float fi = float(i - 4);
                          float fj = float(j - 4);
                          _a = Texel( texture, texture_coords + (glow_dist)*vec2(fi, fj)).a;
                          if (_a < 0.9) {
                              actual_glow_samples += 1;
                              glow = glow + _a;
                          }
                      }
                  }'''
              h = re.sub(pat_holo, rep_holo, h, flags=re.DOTALL)
              if not h.endswith('\n'): h += '\n'
              with open(holo_file, 'w', encoding='utf-8') as f:
                  f.write(h)

          # Fix CRT.fs loop
          crt_file = os.path.join(main_dir, 'resources/shaders/CRT.fs')
          if os.path.exists(crt_file):
              with open(crt_file, 'r', encoding='utf-8', errors='ignore') as f:
                  crt = f.read()
              pat_crt = r'for\s*\(\s*int\s+i\s*=\s*-BLOOM_AMT;.*?float\(BLOOM_AMT\+BLOOM_AMT\)\);\s*\}'
              rep_crt = '''for (int i = 0; i <= 6; ++i) {
                      for (int j = 0; j <= 6; ++j) {
                          float fi = float(i - 3);
                          float fj = float(j - 3);
                          samp = Texel( tex, tc + (bloom_dist/3.0)*vec2(fi, fj));
                          samp.r = max(1./(1.-cutoff)*samp.r - 1./(1.-cutoff) + 1., 0.);
                          samp.g = max(1./(1.-cutoff)*samp.g - 1./(1.-cutoff) + 1., 0.);
                          samp.b = max(1./(1.-cutoff)*samp.b - 1./(1.-cutoff) + 1., 0.);
                          col += min(min(samp.r,samp.g),samp.b) * (2. - abs(fi+fj)/6.0);
                      }
                  }'''
              crt = re.sub(pat_crt, rep_crt, crt, flags=re.DOTALL)
              if not crt.endswith('\n'): crt += '\n'
              with open(crt_file, 'w', encoding='utf-8') as f:
                  f.write(crt)
          "

          # 5. Repack game.love
          rm -f game.love
          (cd "$MAIN_DIR" && zip -r -q "$GITHUB_WORKSPACE/game.love" .)

      - name: Compile with love.js
        run: |
          npm install -g love.js
          love.js -t "Balatro" -m 134217728 -c game.love dist

          # 6. Inject modern full-screen mobile runner with inline console
          cat << 'EOF' > dist/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Balatro</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
              #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
              canvas#canvas { width: 100%; height: 100%; object-fit: contain; }
              #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; text-align: center; pointer-events: none; z-index: 10; }
              #fs-btn { position: fixed; bottom: 12px; right: 12px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 8px 12px; font-size: 12px; border-radius: 4px; z-index: 100; cursor: pointer; }
              #console-btn { position: fixed; bottom: 12px; left: 12px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 8px 12px; font-size: 12px; border-radius: 4px; z-index: 100; cursor: pointer; }
              #error-box { display: none; position: fixed; top: 0; left: 0; width: 100%; max-height: 50%; background: rgba(180, 0, 0, 0.9); color: #fff; padding: 12px; font-size: 11px; overflow-y: auto; z-index: 1000; white-space: pre-wrap; }
            </style>
          </head>
          <body>
            <div id="loading">Loading Balatro...</div>
            <div id="error-box"></div>
            <div id="canvas-container">
              <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>
            <button id="console-btn" onclick="toggleLogs()">Show Logs</button>
            <button id="fs-btn" onclick="toggleFullscreen()">Fullscreen</button>

            <script>
              var logs = [];
              function showErr(msg) {
                var eb = document.getElementById('error-box');
                eb.style.display = 'block';
                eb.textContent += msg + '\n';
              }
              function toggleLogs() {
                var eb = document.getElementById('error-box');
                eb.style.display = (eb.style.display === 'block') ? 'none' : 'block';
              }
              function toggleFullscreen() {
                if (!document.fullscreenElement) {
                  document.documentElement.requestFullscreen().catch(function(){});
                } else {
                  document.exitFullscreen().catch(function(){});
                }
              }
              window.onerror = function(msg, url, line) {
                showErr("Error: " + msg + " (line " + line + ")");
              };

              var Module = {
                arguments: ["./game.love"],
                INITIAL_MEMORY: 134217728,
                print: function(text) { console.log(text); },
                printErr: function(text) {
                  console.error(text);
                  if (text.indexOf("warning") === -1) showErr(text);
                },
                canvas: document.getElementById('canvas'),
                setStatus: function(text) {
                  var el = document.getElementById('loading');
                  if (!text) {
                    el.style.display = 'none';
                  } else {
                    el.textContent = text;
                  }
                }
              };
            </script>
            <script async src="game.js"></script>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
